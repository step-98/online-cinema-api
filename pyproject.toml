[project]
name = "online-cinema"
version = "0.1.0"
description = "Online cinema backend"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.163.1,<0.164.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "email-validator (>=2.4.0,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "stripe (>=17.0.0,<18.0.0)",
    "celery[redis] (>=5.7.0,<6.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (<5)",
]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "alembic/versions"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"